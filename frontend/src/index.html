<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Sinh viên - Client</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: bold; }
    .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    table, th, td { border: 1px solid #ddd; }
    th, td { padding: 10px; text-align: left; }
    th { background: #f2f2f2; }
    .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; display: none; }
    .alert-success { background: #d4edda; color: #155724; }
    .alert-danger { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Thêm Sinh Viên Mới</h2>
    <div id="alertBox" class="alert"></div>
    
    <form id="studentForm">
      <div class="form-group">
        <label for="rollNumber">Mã Sinh Viên:</label>
        <input type="text" id="rollNumber" required />
      </div>
      <div class="form-group">
        <label for="fullName">Họ và Tên:</label>
        <input type="text" id="fullName" required />
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="phone">Số Điện Thoại:</label>
        <input type="text" id="phone" required />
      </div>
      <button type="submit">Lưu Sinh Viên</button>
    </form>

    <hr style="margin-top: 30px;" />

    <h2>Danh Sách Sinh Viên</h2>
    <table>
      <thead>
        <tr>
          <th>Mã SV</th>
          <th>Họ và Tên</th>
          <th>Email</th>
          <th>Số Điện Thoại</th>
        </tr>
      </thead>
      <tbody id="studentTableBody">
        <!-- Dữ liệu sẽ được chèn tự động từ TypeScript -->
      </tbody>
    </table>
  </div>

  <script type="module" src="./app.ts"></script>
</body>
</html>
